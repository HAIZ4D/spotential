# Build the simulator image from the repo root.
#
# The Dockerfile lives in services/simulator/ but the build CONTEXT must be the
# repo root, because the image needs package-lock.json and the sim-engine
# workspace alongside the service. `gcloud run deploy --source` only looks for
# a Dockerfile at the root of the upload, so it cannot express that — hence an
# explicit build config, which also scales to a second service later.

substitutions:
  _REGION: asia-southeast1
  _REPO: spotential
  _SERVICE: simulator

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=services/simulator/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

options:
  # The default Cloud Build service account has no logs bucket of its own.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s
